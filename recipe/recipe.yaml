context:
  name: beckhoff-ads
  tag: 113.0.34-1
  version: ${{ tag | replace('-', '.') }}

recipe:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/Beckhoff/ADS/archive/refs/tags/${{ tag }}.tar.gz
  sha256: 2523bbdf90b153992ced68a689c02943516ec93260b4eddd3108edc710a63596
  patches:
    - meson-build-install-executables.patch
    - headers-use-cplusplus-extern-c.patch

build:
  number: 2
  skip:
    - win
  script: |
    meson setup build --prefix="$PREFIX" -Dlibdir="$PREFIX/lib" -Dwerror=false
    ninja -C build install

outputs:
  - package:
      name: ${{ name }}
    requirements:
      build:
        - ${{ stdlib("c") }}
        - ${{ compiler('cxx') }}
        - meson
        - ninja
      run_exports:
        - ${{ pin_subpackage(name, upper_bound='x.x.x') }}
    build:
      files:
        - include
        - bin
        - if: linux
          then:
            - lib/*.so*
        - if: osx
          then:
            - lib/*.dylib*
        - lib/pkgconfig
    tests:
      - script:
          - test -d "${PREFIX}/include/AdsLib"
          - test -d "${PREFIX}/include/AdsLib/bhf"
          - test -d "${PREFIX}/include/AdsLib/standalone"
          - test -d "${PREFIX}/include/AdsLib/TwinCAT"
          - test -f "${PREFIX}/include/AdsLib/AdsDef.h"
          - test -f "${PREFIX}/include/AdsLib/AdsNotification.h"
          - test -f "${PREFIX}/include/AdsLib/AmsPort.h"
          - test -f "${PREFIX}/include/AdsLib/NotificationDispatcher.h"
          - test -f "${PREFIX}/include/AdsLib/RouterAccess.h"
          - test -f "${PREFIX}/include/AdsLib/AdsDevice.h"
          - test -f "${PREFIX}/include/AdsLib/AdsNotificationOOI.h"
          - test -f "${PREFIX}/include/AdsLib/AmsRouter.h"
          - test -f "${PREFIX}/include/AdsLib/RTimeAccess.h"
          - test -f "${PREFIX}/include/AdsLib/Semaphore.h"
          - test -f "${PREFIX}/include/AdsLib/AdsException.h"
          - test -f "${PREFIX}/include/AdsLib/AdsVariable.h"
          - test -f "${PREFIX}/include/AdsLib/Frame.h"
          - test -f "${PREFIX}/include/AdsLib/RegistryAccess.h"
          - test -f "${PREFIX}/include/AdsLib/Sockets.h"
          - test -f "${PREFIX}/include/AdsLib/wrap_endian.h"
          - test -f "${PREFIX}/include/AdsLib/AdsFile.h"
          - test -f "${PREFIX}/include/AdsLib/AmsConnection.h"
          - test -f "${PREFIX}/include/AdsLib/LicenseAccess.h"
          - test -f "${PREFIX}/include/AdsLib/RingBuffer.h"
          - test -f "${PREFIX}/include/AdsLib/SymbolAccess.h"
          - test -f "${PREFIX}/include/AdsLib/wrap_registry.h"
          - test -f "${PREFIX}/include/AdsLib/AdsLib.h"
          - test -f "${PREFIX}/include/AdsLib/AmsHeader.h"
          - test -f "${PREFIX}/include/AdsLib/Log.h"
          - test -f "${PREFIX}/include/AdsLib/Router.h"
          - test -f "${PREFIX}/include/AdsLib/wrap_socket.h"
          - test -f "${PREFIX}/include/AdsLib/bhf/ParameterList.h"
          - test -f "${PREFIX}/include/AdsLib/bhf/StringToInteger.h"
          - test -f "${PREFIX}/include/AdsLib/bhf/WindowsQuirks.h"
          - test -f "${PREFIX}/include/AdsLib/standalone/AdsDef.h"
          - test -f "${PREFIX}/include/AdsLib/standalone/AdsLib.h"
          - test -f "${PREFIX}/include/AdsLib/TwinCAT/AdsDef.h"
          - test -f "${PREFIX}/include/AdsLib/TwinCAT/AdsLib.h"
          - if: linux
            then:
              - test -f "${PREFIX}/lib/libAdsLib.so"
              - nm -D "${PREFIX}/lib/libAdsLib.so" | grep -q " T AdsSyncSetTimeoutEx"
              - nm -D "${PREFIX}/lib/libAdsLib.so" | grep -q " T AdsSyncGetTimeoutEx"
              - nm -D "${PREFIX}/lib/libAdsLib.so" | grep -q " T AdsPortOpenEx"
          - if: osx
            then:
              - test -f "${PREFIX}/lib/libAdsLib.dylib"
              - nm "${PREFIX}/lib/libAdsLib.dylib" | grep -q "_AdsSyncSetTimeoutEx"
              - nm "${PREFIX}/lib/libAdsLib.dylib" | grep -q "_AdsSyncGetTimeoutEx"
              - nm "${PREFIX}/lib/libAdsLib.dylib" | grep -q "_AdsPortOpenEx"
          - adstool --help
      - requirements:
          build:
            - ${{ compiler('cxx') }}
            - pkg-config
        script:
          - if: linux or osx
            then:
              # Test that the symbols are exported correctly and can be linked against
              - echo '#include <AdsLib.h>' > /tmp/test_sym.cpp
              - echo 'void test(){ AdsSyncSetTimeoutEx(0, 5000); }' >> /tmp/test_sym.cpp
              - $CXX $(pkg-config --cflags AdsLib) -fPIC -shared /tmp/test_sym.cpp $(pkg-config --libs AdsLib) -o /tmp/test_sym.so
              - echo '#include <AdsLib.h>' > /tmp/test_sym_manual.cpp
              - echo 'void test(){ AdsSyncSetTimeoutEx(0, 5000); }' >> /tmp/test_sym_manual.cpp
              - $CXX -I"${PREFIX}/include/AdsLib" -fPIC -shared /tmp/test_sym_manual.cpp -L"${PREFIX}/lib" -lAdsLib -o /tmp/test_sym_manual.so

  - package:
      name: ${{ name }}-static
    requirements:
      build:
        - ${{ stdlib("c") }}
        - ${{ compiler('cxx') }}
        - meson
        - ninja
    build:
      files:
        - lib/*.a
    tests:
      - script:
          - test -f "${PREFIX}/lib/libAdsLib.a"

about:
  homepage: https://github.com/Beckhoff/ADS
  license: MIT
  license_file: LICENSE
  summary: Beckhoff protocol to communicate with TwinCAT devices
  description: |
    This library is intended to provide easy use as ADS client applications running on non-windows systems 
    (e.g. FreeBSD, Linux, ...) to communicate with TwinCAT devices via TCP/IP.
  documentation: https://infosys.beckhoff.com/english.php?content=../content/1033/tc3_ads_intro/index.html
  repository: https://github.com/Beckhoff/ADS

extra:
  recipe-maintainers:
    - AndreFavotto
    - mac-kan
    - javicereijo
